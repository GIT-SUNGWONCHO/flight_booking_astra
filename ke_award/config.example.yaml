# 맨 처음 방식의 러너(python -m ke_award run)가 읽는 설정이다. 지금 쓰는 예매 프로그램(astra)과는 무관하다.
# 쓰려면 저장소 맨 위에 config.yaml 로 복사한다:  copy ke_award\config.example.yaml config.yaml
# 값은 `python -m ke_award probe` 로 리허설을 돌리면 probe_result.txt 에 뽑힙니다.

profile_dir: profile              # 로그인 세션이 저장되는 Chrome 프로필 폴더
browser_channel: chrome           # 설치된 실제 Chrome 사용. 없으면 자동으로 chromium 대체

# --- 대상 ---------------------------------------------------------------
login_url: "https://www.koreanair.com/kr/ko"
search_url: ""                    # ★ probe 로 확보한 "조회 결과가 바로 뜨는" URL
logged_in_text: ["로그아웃", "마이페이지"]

# --- 타이밍 -------------------------------------------------------------
open_at: "2027-03-15 10:00:00"    # ★ 좌석 오픈 시각(KST). 대한항공 공지로 반드시 확인할 것
lead_ms: 150                      # 네트워크 지연 보정: 이만큼 먼저 발사
retry_ms: [1100, 1800]            # 재조회 간격(랜덤). 800ms 미만은 코드에서 강제로 올림
max_minutes: 25                   # 이 시간 지나면 자동 종료
settle_ms: 2500                   # 조회 후 결과 렌더 대기 상한
confirm_timeout_s: 35             # 좌석 클릭 후 성공/실패 판정 대기

# --- 좌석 식별 ----------------------------------------------------------
seat_selector: ""                 # CSS 로 특정 가능하면 여기에 (가장 정확)
seat_text: "프레스티지|Prestige"   # 셀렉터가 없을 때 텍스트로 찾기

# --- 화면 판정 문구 ------------------------------------------------------
soldout_text: ["매진", "좌석이 없", "잔여 좌석 없", "조회된 여정이 없"]
success_text: ["예약번호", "예약이 완료", "발권 완료", "여정 확인"]
session_text: ["세션이 종료", "세션이 만료", "시간이 초과", "처음부터 다시"]

# --- 안전장치 -----------------------------------------------------------
auto_final: false                 # true 로 하면 최종 발권/결제 버튼까지 자동 클릭.
                                  # 마일리지가 실제로 빠져나가므로 기본값 false 권장.
